<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <!-- ENCABEZADO UNIFICADO -->
  <header class="main-header">
    <div class="header-container">
      <div class="header-brand">
        <h1 class="brand-title">Escama y Colmillo</h1>
        <p class="slogan">Crianza respetuosa, ejemplares sanos</p>
        <span class="pimvs">Reg. PIMVS SEMARNAT: UMA-EX-0042-JAL</span>
      </div>

      <div class="header-controls">
        <nav class="header-nav" aria-label="Navegación principal">
          <a href="/index.html" class="btn-nav">Ejemplares</a>
          <a href="/src/pages/nosotros.html" class="btn-nav">Nosotros</a>
        </nav>

        <a href="https://wa.me/525573461033" target="_blank" rel="noopener" class="btn-header-whatsapp">
          <i class="fa-brands fa-whatsapp"></i> <span>Contactar WhatsApp</span>
        </a>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL DE LOGIN -->
  <main class="admin-container" style="max-width: 440px; margin: 40px auto;">
    <section class="admin-panel">
      <div class="panel-header">
        <h2>Acceso al Panel</h2>
      </div>

      <form id="form-login" class="admin-form">
        <div class="form-group">
          <label for="login-email">Correo Electrónico *</label>
          <input type="email" id="login-email" required placeholder="admin@escamaycolmillo.com">
        </div>

        <div class="form-group">
          <label for="login-password">Contraseña *</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>

        <div id="login-error" style="color: #ef4444; font-size: 0.85rem; display: none; padding: 8px; background: rgba(239, 68, 68, 0.1); border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.2);"></div>

        <button type="submit" id="btn-login" class="btn-guardar">
          🔑 Iniciar Sesión
        </button>
      </form>
    </section>
  </main>

  <!-- FOOTER UNIFICADO -->
  <footer class="main-footer">
    <div class="footer-container">
      <nav class="footer-nav" aria-label="Navegación secundaria">
        <a href="/index.html">Catálogo</a>
