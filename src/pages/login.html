<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Escama y Colmillo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="header-brand">
      <h1>Escama y Colmillo</h1>
      <p class="slogan">Acceso Administrativo</p>
    </div>

    <nav class="header-nav" aria-label="Navegación principal">
      <a href="/index.html" class="btn-nav">Ver Catálogo</a>
      <a href="/src/pages/nosotros.html" class="btn-nav">Nosotros</a>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL DE LOGIN -->
  <main class="admin-container" style="max-width: 440px; margin: 40px auto;">
    <section class="admin-panel">
      <div class="panel-header">
        <h2>Acceso al Panel</h2>
      </div>

      <form id="form-login" class="admin-form">
        <div class="form-group">
          <label for="login-email">Correo Electrónico *</label>
          <input type="email" id="login-email" required placeholder="admin@escamaycolmillo.com">
        </div>

        <div class="form-group">
          <label for="login-password">Contraseña *</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>

        <div id="login-error" style="color: #ef4444; font-size: 0.85rem; display: none; padding: 8px; background: rgba(239, 68, 68, 0.1); border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.2);"></div>

        <button type="submit" id="btn-login" class="btn-guardar">
          🔑 Iniciar Sesión
        </button>
      </form>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Escama y Colmillo - Control Interno</p>
  </footer>

  <script type="module" src="/src/views/login-views.js"></script>
</body>
</html>
